
[package]
name = "bit-miner"
version = "0.1.0"
edition = "2024"

[lib]
name = "bit_miner"
path = "src/lib.rs"

[dependencies]
bitcoin = { version = "0.32.7", features = ["serde", "rand-std"] }
bitcoin_hashes = "0.14"
secp256k1 = { version = "0.29", features = ["rand", "global-context", "serde"] }
bech32 = "0.11"
bs58 = { version = "0.5", features = ["check"] }
bip39 = "2"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
mio = { version = "1", features = ["net", "os-poll"] }
qp-hd = { git = "https://github.com/floriddasoftware/QTM" }
qtm-graph = { git = "https://github.com/floriddasoftware/Quantum-Economies" }
quantom_value = { git = "https://github.com/QuantPerm-Labs/Quantom-VALUE" }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
tokio-tungstenite = { version = "0.26", features = ["connect", "rustls-tls-webpki-roots"] }